user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    # Limitar tamaño de body (sitio estático: no se suben archivos grandes)
    client_max_body_size 1m;

    # Compresión Gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        image/x-icon;

    # DNS interno de Docker para resolver el servicio 'weather' en runtime
    # (evita que nginx falle al arrancar si el backend aún no está listo)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rate limiting para los endpoints de API (anti-abuso)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Rate limiting más estricto para el login del admin
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

    server {
        listen       80;
        listen  [::]:80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # ----- Cabeceras de seguridad globales -----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Content-Security-Policy: scopeada a los hosts realmente usados por el sitio.
        # Nota: 'unsafe-eval' es requerido por el CDN de Tailwind (cdn.tailwindcss.com);
        # 'unsafe-inline' por los scripts/estilos y handlers inline de la página.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://images.unsplash.com https://png.pngtree.com https://unpkg.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' https://nominatim.openstreetmap.org https://api.open-meteo.com; worker-src 'self' blob:; upgrade-insecure-requests" always;

        # ----- Proxy del backend de clima (key de OpenWeatherMap server-side) -----
        location = /api/weather {
            limit_req zone=api_limit burst=20 nodelay;
            set $weather_upstream http://weather:3000;
            proxy_pass $weather_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            # Si el backend de clima está caído, devolver JSON de error (el front degrada solo)
            proxy_intercept_errors on;
            error_page 502 503 504 = @weather_down;
        }
        location @weather_down {
            default_type application/json;
            return 503 '{"error":"weather backend unavailable"}';
        }

        # ----- Proxy del backend de admin (API pública de datos) -----
        location = /api/data {
            limit_req zone=api_limit burst=30 nodelay;
            set $admin_upstream http://admin:4000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @admin_down;
        }

        # ----- Calificaciones: promedio (GET) -----
        location = /api/ratings {
            limit_req zone=api_limit burst=20 nodelay;
            set $admin_upstream http://admin:4000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @admin_down;
        }

        # ----- Calificaciones: registrar voto (POST, 1 por IP) -----
        location = /api/vote {
            limit_req zone=api_limit burst=12 nodelay;
            limit_except POST { deny all; }
            set $admin_upstream http://admin:4000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            client_max_body_size 4k;
            proxy_intercept_errors on;
            error_page 502 503 504 = @admin_down;
        }

        # ----- Asistente turístico del mismo origen -----
        location = /api/bot/chat {
            limit_req zone=api_limit burst=12 nodelay;
            limit_except POST { deny all; }
            set $admin_upstream http://admin:4000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 12s;
            client_max_body_size 16k;
            proxy_intercept_errors on;
            error_page 502 503 504 = @admin_down;
        }

        # ----- Panel de admin (protegido por login interno) -----
        # ^~ evita que la regla global de extensiones (.js, .css, imágenes)
        # intercepte los assets propios del panel antes de llegar a Express.
        location ^~ /admin {
            limit_req zone=api_limit burst=20 nodelay;
            # Rate limit adicional solo en el endpoint de login
            location = /admin/login {
                limit_req zone=admin_login burst=3 nodelay;
                set $admin_upstream http://admin:4000;
                proxy_pass $admin_upstream;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 5s;
                proxy_read_timeout 15s;
            }
            set $admin_upstream http://admin:4000;
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # Body más grande permitido para el panel de admin (edición de contenido)
            client_max_body_size 2m;
            proxy_intercept_errors on;
            error_page 502 503 504 = @admin_down;
        }
        location @admin_down {
            default_type application/json;
            return 503 '{"error":"admin backend unavailable"}';
        }

        # ----- Sitio estático -----
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Bloquear acceso a archivos sensibles si llegaran a colarse
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        error_page  404              /404.html;
        location = /404.html { internal; }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }

        # Cache de assets estáticos
        location ~* \.(?:css|js|txt|xml|png|jpe?g|gif|ico|svg|webp|mp4|woff2?|eot|ttf|otf|pdf)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
            log_not_found off;
            access_log off;
        }
    }
}
