<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login · Panel Admin</title>
  <style>
    :root{font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;color:#102a43;background:#eef4fb}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#eef4fb 0%,#f8fbff 100%)}
    .card{background:#fff;padding:24px;border-radius:16px;max-width:420px;width:100%;box-shadow:0 18px 40px rgba(15,23,42,0.08)}
    label{display:block;margin-bottom:10px;font-weight:600;color:#334155}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid #cbd5e1;background:#f8fafc}
    button{margin-top:8px;display:inline-flex;padding:10px 14px;border-radius:10px;border:none;background:#0b5d7b;color:#fff;font-weight:700}
    .small{color:#475569}
    .spinner{width:36px;height:36px;border-radius:50%;border:4px solid rgba(11,93,123,0.12);border-top-color:#0b5d7b;animation:spin 1s linear infinite;margin-left:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 8px">Panel Admin — Iniciar sesión</h2>
    <p class="small">Introduce tus credenciales para acceder al panel.</p>
    <div id="dev-note" class="small" style="display:none;margin-top:8px;color:#a33"><strong>Nota (solo local):</strong> Si estás en localhost, puedes usar la contraseña de desarrollo definida localmente. No usar en producción.</div>
    <!-- Nota de credenciales eliminada para no exponer información sensible en la UI -->
    <label>Usuario<input id="login-user" placeholder="admin" /></label>
    <label>Contraseña<input id="login-pass" type="password" placeholder="••••••" /></label>
    <div class="actions">
      <div id="login-status" class="small" style="display:none">Comprobando credenciales…</div>
      <div id="login-spinner" style="display:none" class="spinner"></div>
      <button id="login-submit">Iniciar sesión</button>
    </div>
  </div>
  <script>
    async function doLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value;
      if (!user || !pass) return alert('Usuario y contraseña requeridos');
      const status = document.getElementById('login-status');
      const spinner = document.getElementById('login-spinner');
      status.style.display = 'block'; spinner.style.display = 'block';
      try {
        const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }), credentials: 'include' });
        if (!r.ok) {
          const txt = await r.text();
          alert('Login falló: ' + r.status + ' ' + txt);
          return;
        }
        // redirect to main admin (canonical entry at /admin)
        window.location.href = '/admin';
      } catch (e) {
        alert('Error: ' + e.message);
      } finally {
        status.style.display = 'none'; spinner.style.display = 'none';
      }
    }
    document.getElementById('login-submit').addEventListener('click', doLogin);
    document.getElementById('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
    // Mostrar nota de desarrollo solo en entornos locales
    try {
      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') {
        const dn = document.getElementById('dev-note'); if (dn) dn.style.display = 'block';
      }
    } catch (e) {}
  </script>
</body>
</html>
