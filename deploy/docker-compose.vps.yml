# Overlay para el VPS: expone 'web' a través de Traefik en el dominio definitivo.
# Se aplica junto al base:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml up -d --build
services:
  web:
    # En el VPS no publicamos puertos al host: Traefik enruta por la red 'web'.
    ports: !reset []
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Ruteo por dominio (vivisanroque.munisanroque.ar)
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}.rule=Host(`${DOMAIN:-vivisanroque.munisanroque.ar}`)"
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}.tls=true"
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}.tls.certresolver=letsencrypt"
      # Redirección HTTP -> HTTPS
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}-http.rule=Host(`${DOMAIN:-vivisanroque.munisanroque.ar}`)"
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}-http.entrypoints=web"
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}-http.middlewares=${PROJECT_NAME:-vivisanroque}-redirect"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-redirect.redirectscheme.permanent=true"
      # Middlewares de seguridad (HSTS, etc.) en el borde
      - "traefik.http.routers.${PROJECT_NAME:-vivisanroque}.middlewares=${PROJECT_NAME:-vivisanroque}-sec"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-vivisanroque}-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.services.${PROJECT_NAME:-vivisanroque}.loadbalancer.server.port=80"

  weather:
    # El backend de clima nunca se expone a internet; solo lo consume 'web'.
    networks:
      - internal

networks:
  web:
    external: true
