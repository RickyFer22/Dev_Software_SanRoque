<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Redirigiendo a la Agenda · Viví San Roque</title>
  <!--
    Esta página dejó de ser un evento fijo hardcodeado: antes TODOS los
    eventos del listado (agenda.html) enlazaban acá sin importar cuál se
    clickeara, mostrando siempre el mismo contenido de "Fiestas Patronales"
    aunque hubiera otros eventos cargados. Ahora cada evento tiene su propia
    ficha real en /agenda/<id> (servida por agenda.html, mismo patrón que
    gastronomia.html). Este archivo queda solo como redirección para
    bookmarks/enlaces externos viejos que apunten a /evento.html.
  -->
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://vivisanroque.munisanroque.ar/agenda.html" />
  <meta http-equiv="refresh" content="0; url=/agenda.html" />
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = params.get('id') || params.get('e');
      location.replace(id ? '/agenda/' + encodeURIComponent(id) : '/agenda.html');
    })();
  </script>
</head>
<body>
  <p>Redirigiendo a <a href="/agenda.html">la Agenda de Eventos</a>…</p>
</body>
</html>
