name: CI / CD Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Self-Hosted VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            PROJECT_PATH="/opt/projects/dev-software-sanroque"

            echo "=== Verificando existencia del proyecto ==="
            if [ ! -d "$PROJECT_PATH" ]; then
              echo "[INFO] Directorio no existe. Clonando repositorio..."
              mkdir -p "$PROJECT_PATH"
              git clone git@github.com:RickyFer22/Dev_Software_SanRoque.git "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"

            echo "=== Actualizando código ==="
            git pull origin main || echo "[WARN] Pull fallido, continuando con archivos locales..."

            echo "=== Asegurando red docker 'web' ==="
            docker network inspect web >/dev/null 2>&1 || docker network create web

            echo "=== Construyendo imagen Docker ==="
            docker compose -f docker-compose.yml -f docker-compose.vps.yml build web

            echo "=== Levantando contenedor ==="
            docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --no-deps web

            echo "=== Health check ==="
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.vps.yml ps
            echo "=== Despliegue completado ==="
