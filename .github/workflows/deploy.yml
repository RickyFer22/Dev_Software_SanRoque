name: CI / CD Deploy to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Self-Hosted VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          # La API key viaja como variable de entorno del runner y se inyecta
          # en la sesión SSH vía 'envs'. Nunca se imprime en los logs.
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          # Secreto del bot para OpenRouter o el proveedor configurado.
          BOT_API_KEY: ${{ secrets.BOT_API_KEY }}
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          BOT_PROVIDER: ${{ secrets.BOT_PROVIDER }}
          BOT_TIMEOUT_MS: ${{ secrets.BOT_TIMEOUT_MS }}
          # Opcional: si se define el secreto SESSION_SECRET, las sesiones del panel
          # admin persisten entre reinicios. Si no, el server genera uno aleatorio.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: OWM_API_KEY,BOT_API_KEY,BOT_API_URL,BOT_PROVIDER,BOT_TIMEOUT_MS,SESSION_SECRET
          script: |
            set -e
            PROJECT_PATH="/opt/projects/vivisanroque"
            # Repositorio PÚBLICO: se clona por HTTPS (el VPS no necesita llave SSH de GitHub)
            REPO_URL="https://github.com/RickyFer22/Dev_Software_SanRoque.git"

            echo "=== Verificando proyecto ==="
            if [ ! -d "$PROJECT_PATH/.git" ]; then
              echo "[INFO] Clonando repositorio (HTTPS)..."
              rm -rf "$PROJECT_PATH"
              git clone "$REPO_URL" "$PROJECT_PATH"
            fi

            cd "$PROJECT_PATH"

            echo "=== Actualizando código ==="
            # Forzar origin a HTTPS por si un clon previo quedó en SSH (causa del fallo anterior)
            git remote set-url origin "$REPO_URL"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Generando deploy/.env desde secretos (NO se versiona) ==="
            if [ -z "${OWM_API_KEY:-}" ]; then
              echo "[ERROR] Falta el secreto OWM_API_KEY en GitHub."
              echo "        Settings > Secrets and variables > Actions > New repository secret: OWM_API_KEY"
              exit 1
            fi
            # umask 077 => el archivo queda con permisos 600 (solo root lo lee)
            umask 077
            cat > deploy/.env <<ENVEOF
            PROJECT_NAME=vivisanroque
            DOMAIN=vivisanroque.munisanroque.ar
            OWM_API_KEY=${OWM_API_KEY}
            OWM_UNITS=metric
            OWM_LANG=es
            WEATHER_CACHE_TTL_MS=600000
            BOT_API_URL=${BOT_API_URL:-https://openrouter.ai/api/v1/chat/completions}
            BOT_API_KEY=${BOT_API_KEY:-}
            BOT_PROVIDER=${BOT_PROVIDER:-openrouter}
            BOT_TIMEOUT_MS=${BOT_TIMEOUT_MS:-8000}
            SESSION_SECRET=${SESSION_SECRET:-}
            ADMIN_ALLOWED_ORIGINS=https://vivisanroque.munisanroque.ar
            ENVEOF
            echo "[OK] deploy/.env generado ($(wc -l < deploy/.env) líneas, key oculta)."

            echo "=== Asegurando red docker 'web' (Traefik) ==="
            docker network inspect web >/dev/null 2>&1 || docker network create web

            echo "=== Build & Up ==="
            docker compose --env-file deploy/.env \
              -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml build
            docker compose --env-file deploy/.env \
              -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml up -d --remove-orphans

            echo "=== Verificando salud del backend admin ==="
            ADMIN_READY=false
            for attempt in $(seq 1 30); do
              if curl -fsS https://vivisanroque.munisanroque.ar/api/data >/dev/null; then
                ADMIN_READY=true
                break
              fi
              sleep 2
            done
            if [ "$ADMIN_READY" != "true" ]; then
              echo "[ERROR] El backend admin no quedó disponible."
              docker logs --tail 100 vivisanroque_admin || true
              exit 1
            fi

            echo "=== Estado ==="
            docker compose --env-file deploy/.env \
              -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml ps
            echo "=== Despliegue completado: https://vivisanroque.munisanroque.ar ==="
