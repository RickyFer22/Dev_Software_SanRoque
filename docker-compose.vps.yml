services:
  web:
    ports: !reset []
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Ruteo por dominio devsoftware.munisanroque.ar
      - "traefik.http.routers.${PROJECT_NAME:-portal_sanroque}.rule=Host(`${DOMAIN:-devsoftware.munisanroque.ar}`)"
      - "traefik.http.routers.${PROJECT_NAME:-portal_sanroque}.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME:-portal_sanroque}.tls.certresolver=letsencrypt"
      # Middlewares de seguridad
      - "traefik.http.routers.${PROJECT_NAME:-portal_sanroque}.middlewares=${PROJECT_NAME:-portal-sanroque}-headers"
      - "traefik.http.middlewares.${PROJECT_NAME:-portal-sanroque}-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${PROJECT_NAME:-portal-sanroque}-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-portal-sanroque}-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-portal-sanroque}-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${PROJECT_NAME:-portal-sanroque}-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Puerto interno del contenedor Nginx expuesto a Traefik
      - "traefik.http.services.${PROJECT_NAME:-portal_sanroque}.loadbalancer.server.port=80"

networks:
  web:
    external: true
