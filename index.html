<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Municipal San Roque</title>
<meta name="description" content="Portal Municipal de San Roque - Conectando a la comunidad con su municipio a través de tecnología innovadora.">
<meta property="og:title" content="Portal Municipal San Roque">
<meta property="og:description" content="Conectando a la comunidad con su municipio a través de tecnología innovadora.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://munisanroque.ar/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ══════════ RESET & BASE ══════════ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --verde:#134e4a;
  --verde-oscuro:#0d3937;
  --verde-claro:#1a6b65;
  --dorado:#d4a83c;
  --dorado-claro:#f5d98a;
  --gris-fondo:#f4f7f6;
  --gris-texto:#4a5568;
}

html{scroll-behavior:smooth;}
body{
  background:#0a2e2b;
  font-family:'DM Sans',sans-serif;
  color:#fff;
  overflow-x:hidden;
  overflow-y:auto;
}

/* ── canvas ── */
#canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
@media (prefers-reduced-motion: reduce) {
  #canvas { display: none; }
}

/* ── grid ── */
.grid-bg{
  position:fixed;inset:0;
  background-image:linear-gradient(rgba(212,168,60,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(212,168,60,.03) 1px,transparent 1px);
  background-size:72px 72px;
  pointer-events:none;z-index:0;
}

/* ══════════ NAVBAR ══════════ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 3rem;
  background:rgba(10,46,43,.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(212,168,60,.1);
  opacity:0;animation:navIn .5s ease .1s forwards;
  transition:background .3s ease,border-color .3s ease;
}

/* Light theme */
body.light-mode{
  background:#f4f7f6;
  color:#1a202c;
}
body.light-mode nav{
  background:rgba(255,255,255,.85);
  border-bottom:1px solid rgba(19,78,74,.1);
}
body.light-mode .nav-brand{
  color:rgba(26,32,44,.8);
}
body.light-mode .hero-headline .l1,
body.light-mode .hero-headline .l2{
  color:#1a202c;
}
body.light-mode .hero-desc{
  color:rgba(26,32,44,.7);
}
body.light-mode .blob-1{
  background:radial-gradient(circle,rgba(26,107,101,.3) 0%,transparent 70%);
}
body.light-mode .blob-2{
  background:radial-gradient(circle,rgba(212,168,60,.2) 0%,transparent 65%);
}
body.light-mode .blob-3{
  background:radial-gradient(circle,rgba(19,78,74,.15) 0%,transparent 65%);
}
body.light-mode .grid-bg{
  background-image:linear-gradient(rgba(19,78,74,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(19,78,74,.05) 1px,transparent 1px);
}
@keyframes navIn{to{opacity:1;}}

.nav-brand{
  display:flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.8);text-decoration:none;
}
.nav-live{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

.nav-links{display:flex;align-items:center;list-style:none;gap:1rem;}

.theme-toggle{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
  border-radius:10px;
  border:1px solid rgba(212,168,60,.3);
  background:rgba(212,168,60,.05);
  color:var(--dorado-claro);
  cursor:pointer;
  transition:all .3s cubic-bezier(.25,.8,.25,1);
  font-size:18px;
}
.theme-toggle:hover{
  background:var(--dorado);
  color:var(--verde-oscuro);
  border-color:var(--dorado);
  transform:translateY(-2px);
}
body.light-mode .theme-toggle{
  border-color:rgba(19,78,74,.3);
  background:rgba(19,78,74,.05);
  color:var(--verde);
}
body.light-mode .theme-toggle:hover{
  background:var(--verde);
  color:#fff;
  border-color:var(--verde);
}
.nav-portal-btn {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dorado-claro);
  text-decoration: none;
  padding: 8px 18px;
  border-radius: 10px;
  border: 1px solid rgba(212, 168, 60, 0.3);
  background: rgba(212, 168, 60, 0.05);
  transition: all 0.3s cubic-bezier(.25,.8,.25,1);
}
.nav-portal-btn:hover {
  background: var(--dorado);
  color: var(--verde-oscuro);
  border-color: var(--dorado);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(212, 168, 60, 0.15);
}

/* ══════════ HERO ══════════ */
.hero{
  position:relative;z-index:1;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:7rem 1.5rem 4rem;
  text-align:center;
  overflow:hidden;
}

/* ambient blobs */
.blob{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;}
.blob-1{width:600px;height:600px;top:-200px;left:-200px;background:radial-gradient(circle,rgba(19,78,74,.55) 0%,transparent 70%);animation:blob1 10s ease-in-out infinite;}
.blob-2{width:500px;height:500px;bottom:-150px;right:-150px;background:radial-gradient(circle,rgba(212,168,60,.13) 0%,transparent 65%);animation:blob2 13s ease-in-out infinite;}
.blob-3{width:350px;height:350px;top:40%;left:60%;background:radial-gradient(circle,rgba(26,107,101,.2) 0%,transparent 65%);animation:blob2 8s ease-in-out 2s infinite;}
@keyframes blob1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,30px) scale(1.08);}}
@keyframes blob2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,-20px) scale(1.05);}}

.hero-inner{position:relative;z-index:2;max-width:900px;width:100%;display:flex;flex-direction:column;align-items:center;}

/* eyebrow */
.eyebrow{
  display:inline-flex;align-items:center;
  padding:6px 18px;border-radius:999px;
  border:1px solid rgba(212,168,60,.25);background:rgba(212,168,60,.06);
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;
  color:var(--dorado);text-transform:uppercase;
  margin-bottom:2.5rem;
  opacity:0;animation:fadeUp .6s ease .4s forwards;
}

/* headline */
.hero-headline{
  margin-bottom:2rem;
  opacity:0;animation:fadeUp .8s cubic-bezier(.22,1,.36,1) .7s forwards;
}
.hero-headline .l1{
  display:block;
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem, 6.2vw, 4.2rem);
  font-weight:800;
  color:#fff;
  line-height:1.1;
  letter-spacing:-1px;
}
.hero-headline .l2{
  display:block;
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem, 6.2vw, 4.2rem);
  font-weight:800;
  color:var(--dorado-claro);
  line-height:1.1;
  letter-spacing:-1px;
  margin-top:0.3rem;
}
.hero-headline .l2 .underline-gold{
  position:relative;
  display:inline-block;
}
.hero-headline .l2 .underline-gold::after{
  content:'';
  position:absolute;
  bottom:-4px;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,var(--dorado),var(--dorado-claro),var(--dorado));
  border-radius:2px;
  transform:scaleX(0);
  transform-origin:left;
  animation:lineGrow .9s cubic-bezier(.22,1,.36,1) 1.4s forwards;
}
@keyframes lineGrow{to{transform:scaleX(1);}}

/* descriptor */
.hero-desc{
  font-size:clamp(.95rem, 1.4vw, 1.1rem);
  font-weight:300;
  color:rgba(255,255,255,.65);
  line-height:1.8;
  max-width:620px;
  margin:0 auto 3rem;
  padding:0 1rem;
  opacity:0;
  animation:fadeUp .6s ease 1.1s forwards;
}

/* CTAs */
.hero-ctas{
  display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:fadeUp .6s ease 1.3s forwards;
}
.btn-p{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 36px;border-radius:14px;
  background:var(--dorado);color:var(--verde-oscuro);
  font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:.3px;
  text-decoration:none;border:none;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
}
.btn-p:hover{background:var(--dorado-claro);transform:translateY(-4px) scale(1.05);box-shadow:0 20px 48px rgba(212,168,60,.35);}
.btn-o{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 32px;border-radius:14px;
  border:1px solid rgba(212,168,60,.3);background:transparent;
  color:var(--dorado-claro);font-family:'Syne',sans-serif;font-size:14px;font-weight:600;
  text-decoration:none;
  transition:all .3s ease;
}
.btn-o:hover{border-color:var(--dorado);background:rgba(212,168,60,.07);transform:translateY(-3px);}

@keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}

/* ══════════ MEDIA QUERIES ══════════ */
@media(max-width:1024px){
  nav{
    padding:.9rem 2rem;
  }
  .hero-headline .l1,
  .hero-headline .l2{
    font-size:clamp(2rem, 5vw, 3.5rem);
  }
}

@media(max-width:768px){
  nav{
    padding:.9rem 1.5rem;
  }
  .nav-brand{
    font-size:12px;
  }
  .hero{
    padding:6rem 1rem 3rem;
  }
  .theme-toggle{
    width:36px;
    height:36px;
    font-size:16px;
  }
}

@media(max-width:480px){
  .hero-ctas{
    flex-direction:column;
    width:100%;
    max-width:300px;
    margin:0 auto;
  }
  .btn-p, .btn-o{
    width:100%;
    justify-content:center;
  }
  .eyebrow{
    font-size:10px;
    letter-spacing:1px;
    padding:5px 14px;
    margin-bottom:1.8rem;
  }
  .hero-desc{
    margin-bottom:2.2rem;
  }
}
</style>
</head>
<body>

<canvas id="canvas" aria-label="Animación de partículas decorativa"></canvas>
<div class="grid-bg"></div>

<!-- ── NAV ── -->
<nav>
  <a class="nav-brand" href="#">
    <div class="nav-live"></div>
    Portal Municipal · San Roque
  </a>
  <ul class="nav-links">
    <li><button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌙</button></li>
    <li><a class="nav-portal-btn" href="https://munisanroque.ar/" target="_blank">Portal ▸</a></li>
  </ul>
</nav>

<!-- ══════════════ HERO ══════════════ -->
<section class="hero">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="hero-inner">
    <div class="eyebrow">¿Listo para construir?</div>

    <h1 class="hero-headline">
      <span class="l1">San Roque</span>
      <span class="l2"><span class="underline-gold">te necesita.</span></span>
    </h1>

    <p class="hero-desc">
      Cada línea de código conecta a una persona con su municipio, su cultura y su comunidad. El impacto es real.
    </p>

    <div class="hero-ctas">
      <a class="btn-p" href="alojamientos.html">
        Ver alojamientos &rarr;
      </a>
      <a class="btn-o" href="https://munisanroque.ar/" target="_blank">
        Ir al portal &rarr;
      </a>
      <a class="btn-o" href="https://chat.whatsapp.com/EwGPRSL3hI4BcsTHbYSCqy" target="_blank">
        Contactar al equipo
      </a>
    </div>
  </div>
</section>

<script>
/* ── theme toggle ── */
(function(){
  const themeToggle=document.getElementById('themeToggle');
  const body=document.body;
  
  // Verificar preferencia guardada
  const savedTheme=localStorage.getItem('theme');
  if(savedTheme==='light'){
    body.classList.add('light-mode');
    themeToggle.textContent='☀️';
  }
  
  // Toggle tema
  themeToggle.addEventListener('click',()=>{
    body.classList.toggle('light-mode');
    const isLight=body.classList.contains('light-mode');
    themeToggle.textContent=isLight?'☀️':'🌙';
    localStorage.setItem('theme',isLight?'light':'dark');
  });
})();

/* ── particles system ── */
(function(){
  // Verificar soporte de canvas
  const c=document.getElementById('canvas');
  if(!c || !c.getContext) return;
  
  const ctx=c.getContext('2d');
  let W,H,animationId;
  let isVisible=true;
  
  // Colores de partículas
  const COLS=['#d4a83c','#f5d98a','rgba(26,107,101,.8)','rgba(19,78,74,.9)','rgba(212,168,60,.4)'];
  
  // Redimensionar canvas
  function resize(){
    W=c.width=window.innerWidth;
    H=c.height=window.innerHeight;
  }
  
  // Crear nueva partícula
  function mk(){
    return{
      x:Math.random()*W,
      y:H+10,
      r:Math.random()*1.8+.4,
      dx:(Math.random()-.5)*.4,
      dy:-(Math.random()*.65+.2),
      a:Math.random()*.4+.06,
      col:COLS[Math.floor(Math.random()*COLS.length)],
      life:1,
      dec:Math.random()*.002+.0007,
      tw:Math.random()*Math.PI*2
    };
  }
  
  // Inicializar partículas
  const ps=Array.from({length:80},mk).map(p=>{p.y=Math.random()*H;p.life=Math.random();return p;});
  
  // Dibujar frame
  function draw(){
    if(!isVisible) return;
    
    ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{
      p.life-=p.dec;
      p.x+=p.dx;
      p.y+=p.dy;
      p.tw+=.025;
      
      if(p.life<=0) Object.assign(p,mk());
      
      ctx.save();
      ctx.globalAlpha=p.a*p.life*(0.75+0.25*Math.sin(p.tw));
      ctx.fillStyle=p.col;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });
    
    animationId=requestAnimationFrame(draw);
  }
  
  // Pausar animación cuando la pestaña no está visible
  document.addEventListener('visibilitychange',()=>{
    isVisible=!document.hidden;
    if(isVisible) draw();
    else cancelAnimationFrame(animationId);
  });
  
  window.addEventListener('resize',resize);
  resize();
  draw();
})();
</script>
</body>
</html>
