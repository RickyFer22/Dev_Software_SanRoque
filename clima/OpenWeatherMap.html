<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clima · San Roque</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:  #5eb8ff;
      --accent2: #ff9e3e;
      --glass:   rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --text:    #e8f4ff;
      --muted:   rgba(232,244,255,0.45);
    }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }
    body {
      background: #040c22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      position: relative;
    }
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-gradient {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #0d3b7a 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, #061a4a 0%, transparent 60%),
        linear-gradient(180deg, #040c22 0%, #0d2147 50%, #1a3a6b 100%);
    }
    .stars { position: absolute; inset: 0; }
    .star {
      position: absolute; width: 2px; height: 2px;
      background: white; border-radius: 50%; opacity: 0;
      animation: twinkle var(--d,4s) ease-in-out infinite var(--delay,0s);
    }
    @keyframes twinkle {
      0%,100% { opacity:0; transform:scale(1); }
      50%      { opacity:var(--op,.7); transform:scale(1.4); }
    }
    .aurora {
      position: absolute; width: 200%; height: 300px;
      bottom: -80px; left: -50%;
      background: linear-gradient(180deg, transparent, rgba(78,178,255,0.07) 40%, rgba(78,178,255,0.13) 70%, transparent);
      border-radius: 50%; animation: auroraPulse 8s ease-in-out infinite; filter: blur(30px);
    }
    @keyframes auroraPulse {
      0%,100% { opacity:.5; transform:scaleY(1); }
      50%      { opacity:1;  transform:scaleY(1.3); }
    }
    .card {
      position: relative; z-index: 10;
      width: min(520px, 100%);
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 28px; padding: 40px 36px 36px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
      animation: cardIn .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(30px) scale(.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:36px; }
    .city-label {
      font-family:'Bebas Neue',sans-serif; font-size:clamp(2.8rem,8vw,4rem);
      letter-spacing:3px; line-height:1; color:#fff; font-weight:400;
    }
    .region-label { font-size:.85rem; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-top:6px; font-weight:500; }
    .date-block { text-align:right; }
    .date-label { font-size:.76rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .time-label { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:3px; color:var(--accent); margin-top:2px; }
    .main-temp-row { display:flex; align-items:center; gap:20px; margin-bottom:8px; }
    .weather-icon-wrap { width:82px; height:82px; flex-shrink:0; }
    .weather-icon-wrap img {
      width:100%; height:100%; object-fit:contain;
      filter:drop-shadow(0 0 18px rgba(94,184,255,.6));
      animation:iconFloat 4s ease-in-out infinite;
    }
    @keyframes iconFloat {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-6px); }
    }
    .temp-value {
      font-family:'Bebas Neue',sans-serif; font-size:clamp(3.8rem,12vw,6rem);
      line-height:1; letter-spacing:-2px;
      background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .temp-desc { font-size:.88rem; font-style:italic; color:var(--muted); margin-top:2px; text-transform:capitalize; }
    .feels-row { font-size:.8rem; color:var(--muted); margin-bottom:28px; letter-spacing:.04em; }
    .feels-row span { color:var(--text); font-weight:500; }
    .divider { width:100%; height:1px; background:linear-gradient(90deg,transparent,var(--glass-border),transparent); margin-bottom:24px; }
    .stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
    .stat-box {
      background:rgba(255,255,255,.04); border:1px solid var(--glass-border);
      border-radius:14px; padding:14px 10px; text-align:center;
      transition:background .25s,transform .25s;
    }
    .stat-box:hover { background:rgba(94,184,255,.08); transform:translateY(-3px); }
    .stat-icon { font-size:1.2rem; margin-bottom:5px; }
    .stat-value { font-family:'Bebas Neue',sans-serif; font-size:1.35rem; letter-spacing:1px; color:var(--accent); }
    .stat-label { font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
    .sun-row { display:flex; gap:12px; }
    .sun-box {
      flex:1; background:rgba(255,158,62,.06); border:1px solid rgba(255,158,62,.18);
      border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px;
    }
    .sun-emoji { font-size:1.4rem; }
    .sun-time { font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:1.5px; color:var(--accent2); }
    .sun-lbl { font-size:.65rem; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
    .state-msg { text-align:center; padding:40px 0; }
    .spinner {
      width:42px; height:42px; border:3px solid var(--glass-border); border-top-color:var(--accent);
      border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .state-msg p { color:var(--muted); font-size:.88rem; letter-spacing:.06em; }
    .error-icon { font-size:2.2rem; margin-bottom:8px; }
    .error-text { color:#ff6b6b; font-size:.86rem; }
    .retry-btn {
      margin-top:16px; padding:9px 24px; border:1px solid rgba(255,107,107,.3); border-radius:50px;
      background:transparent; color:#ff9e9e; font-family:'DM Sans',sans-serif; font-size:.78rem;
      letter-spacing:.1em; text-transform:uppercase; cursor:pointer; transition:background .2s;
    }
    .retry-btn:hover { background:rgba(255,107,107,.1); }
    .footer { margin-top:24px; text-align:center; font-size:.68rem; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
    .refresh-btn {
      display:inline-flex; align-items:center; gap:6px;
      margin-top:10px; padding:8px 20px; border:1px solid var(--glass-border); border-radius:50px;
      background:transparent; color:var(--text); font-family:'DM Sans',sans-serif; font-size:.75rem;
      letter-spacing:.1em; text-transform:uppercase; cursor:pointer; transition:background .2s,border-color .2s;
    }
    .refresh-btn:hover { background:rgba(94,184,255,.1); border-color:var(--accent); }
    .refresh-btn svg {
      width:13px; height:13px; fill:none; stroke:currentColor;
      stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
    }
    .refresh-btn.spinning svg { animation:spin .7s linear infinite; }
    .weather-content { display:block; }
  </style>
</head>
<body>

<div class="bg">
  <div class="bg-gradient"></div>
  <div class="stars" id="stars"></div>
  <div class="aurora"></div>
</div>

<div class="card">

  <div class="state-msg" id="loader" style="display:none">
    <div class="spinner"></div>
    <p>Consultando el cielo&hellip;</p>
  </div>

  <div class="state-msg" id="errorMsg" style="display:none">
    <div class="error-icon">⚡</div>
    <p class="error-text" id="errorText">No se pudo obtener el clima.</p>
    <button class="retry-btn" onclick="fetchWeather()">↺ Reintentar</button>
  </div>

  <div class="weather-content" id="weatherContent">
    <div class="header">
      <div>
        <div class="city-label" id="cityName">—</div>
        <div class="region-label" id="countryName">—</div>
      </div>
      <div class="date-block">
        <div class="date-label" id="dateLabel">—</div>
        <div class="time-label" id="timeLabel">—</div>
      </div>
    </div>
    <div class="main-temp-row">
      <div class="weather-icon-wrap"><img id="weatherIcon" src="" alt="clima"/></div>
      <div>
        <div class="temp-value"><span id="tempValue">—</span>°</div>
        <div class="temp-desc" id="weatherDesc">—</div>
      </div>
    </div>
    <div class="feels-row">
      Sensación <span id="feelsLike">—</span>°C &nbsp;·&nbsp;
      Máx <span id="tempMax">—</span>° &nbsp;/&nbsp; Mín <span id="tempMin">—</span>°
    </div>
    <div class="divider"></div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-icon">💧</div><div class="stat-value" id="humidity">—</div><div class="stat-label">Humedad %</div></div>
      <div class="stat-box"><div class="stat-icon">🌬️</div><div class="stat-value" id="windSpeed">—</div><div class="stat-label">Viento km/h</div></div>
      <div class="stat-box"><div class="stat-icon">📊</div><div class="stat-value" id="pressure">—</div><div class="stat-label">Presión hPa</div></div>
      <div class="stat-box"><div class="stat-icon">👁️</div><div class="stat-value" id="visibility">—</div><div class="stat-label">Visib. km</div></div>
      <div class="stat-box"><div class="stat-icon">☁️</div><div class="stat-value" id="clouds">—</div><div class="stat-label">Nubes %</div></div>
      <div class="stat-box"><div class="stat-icon">🌡️</div><div class="stat-value" id="dewPoint">—</div><div class="stat-label">P. Rocío</div></div>
    </div>
    <div class="sun-row">
      <div class="sun-box">
        <div class="sun-emoji">🌅</div>
        <div><div class="sun-time" id="sunrise">—</div><div class="sun-lbl">Amanecer</div></div>
      </div>
      <div class="sun-box">
        <div class="sun-emoji">🌇</div>
        <div><div class="sun-time" id="sunset">—</div><div class="sun-lbl">Atardecer</div></div>
      </div>
    </div>
  </div>

  <div class="footer">
    Actualizado en tiempo real &middot; OpenWeatherMap
    <br>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchWeather()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Actualizar
    </button>
  </div>

</div>

<script>
  /* ── Clave partida (ofuscada) ── */
  const _a = '706c1df8';
  const _b = '08bd988f';
  const _c = 'ad8aff24';
  const _d = '039f11f4';
  const KEY = _a+_b+_c+_d;

  /* URL del proxy local para evitar CORS */
  const API = () =>
    `/api/weather?lat=-28.47&lon=-57.55`;

  /* ── Estrellas ── */
  (function(){
    const c=document.getElementById('stars');
    for(let i=0;i<140;i++){
      const s=document.createElement('div'); s.className='star';
      s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
        --d:${3+Math.random()*5}s;--delay:${Math.random()*6}s;
        --op:${.3+Math.random()*.7};
        width:${Math.random()<.15?3:2}px;height:${Math.random()<.15?3:2}px`;
      c.appendChild(s);
    }
  })();

  /* ── Reloj ── */
  function updateClock(){
    const n=new Date();
    document.getElementById('dateLabel').textContent=
      n.toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
    document.getElementById('timeLabel').textContent=
      n.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  }
  setInterval(updateClock,1000); updateClock();

  /* ── Punto de rocío ── */
  function dewPt(T,RH){
    const a=17.27,b=237.7,al=((a*T)/(b+T))+Math.log(RH/100);
    return Math.round((b*al)/(a-al));
  }

  /* ── Unix → hora local ── */
  function ts2h(unix,off){
    const d=new Date((unix+off)*1000);
    const hh=String(Math.floor(((unix+off)%86400)/3600)).padStart(2,'0');
    const mm=String(Math.floor(((unix+off)%3600)/60)).padStart(2,'0');
    return hh+':'+mm;
  }

  /* ── Fetch con reintentos ── */
  async function tryFetch(url, attempts=3){
    for(let i=0;i<attempts;i++){
      try{
        const r=await fetch(url);
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } catch(e){
        if(i===attempts-1) throw e;
        await new Promise(r=>setTimeout(r,1200*(i+1)));
      }
    }
  }

  async function fetchWeather(){
    const loader  = document.getElementById('loader');
    const errDiv  = document.getElementById('errorMsg');
    const btn     = document.getElementById('refreshBtn');

    console.log('Iniciando fetchWeather');
    loader.style.display='block'; errDiv.style.display='none';
    btn.classList.add('spinning');

    const apiUrl = API();
    console.log('Intentando API:', apiUrl);

    try{
      const d = await tryFetch(apiUrl);
      console.log('Datos recibidos:', d);

      if(d.error){
        throw new Error(d.error);
      }

      document.getElementById('cityName').textContent    = 'San Roque';
      document.getElementById('countryName').textContent = 'Corrientes, Argentina';
      document.getElementById('tempValue').textContent   = Math.round(d.main.temp);
      document.getElementById('weatherDesc').textContent = d.weather[0].description;
      document.getElementById('weatherIcon').src         = `https://openweathermap.org/img/wn/${d.weather[0].icon}@2x.png`;
      document.getElementById('feelsLike').textContent   = Math.round(d.main.feels_like);
      document.getElementById('tempMax').textContent     = Math.round(d.main.temp_max);
      document.getElementById('tempMin').textContent     = Math.round(d.main.temp_min);
      document.getElementById('humidity').textContent    = d.main.humidity;
      document.getElementById('windSpeed').textContent   = Math.round(d.wind.speed*3.6);
      document.getElementById('pressure').textContent    = d.main.pressure;
      document.getElementById('visibility').textContent  = (d.visibility/1000).toFixed(1);
      document.getElementById('clouds').textContent      = d.clouds.all;
      document.getElementById('dewPoint').textContent    = dewPt(d.main.temp,d.main.humidity)+'°';
      document.getElementById('sunrise').textContent     = ts2h(d.sys.sunrise, d.timezone);
      document.getElementById('sunset').textContent      = ts2h(d.sys.sunset,  d.timezone);

      loader.style.display='none';
      console.log('Datos actualizados');
    }catch(err){
      console.error('Error en fetchWeather:', err);
      loader.style.display='none';
      document.getElementById('errorText').textContent = '⚠ '+err.message;
      errDiv.style.display='block';
    }finally{
      btn.classList.remove('spinning');
    }
  }

  fetchWeather();
</script>
</body>
</html>
